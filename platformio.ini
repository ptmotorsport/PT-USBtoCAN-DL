; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
build_src_filter = +<*> -<ins_main.cpp>
build_flags =
	-DUSE_SD_CRC=1
	-DUSE_SPI_ARRAY_TRANSFER=0
extra_scripts =
	pre:scripts/configure_rtc_subclk.py
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
	Arduino_CAN
	greiman/SdFat@^2.2.0

[env:ins_vehicle]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
build_src_filter = -<*> +<ins_main.cpp> +<slcan_bridge.cpp>
build_flags =
	-DINS_VEHICLE=1
	-fstack-usage
extra_scripts =
	post:scripts/configure_ins_memory.py
lib_deps =
	Arduino_CAN
