; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno_r4_minima

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
build_flags =
	-DUSE_SD_CRC=1
	-DUSE_SPI_ARRAY_TRANSFER=0
extra_scripts =
	pre:scripts/configure_rtc_subclk.py
; Do not pull incompatible optional FastLED dependencies into Minima builds.
lib_ignore =
	WiFiS3
	I2S
lib_deps =
	fastled/FastLED@^3.10.9
	Arduino_CAN
	greiman/SdFat@^2.2.0

[env:uno_r4_minima_bulk]
extends = env:uno_r4_minima
build_flags =
	-DUSE_SD_CRC=1
	-DUSE_SPI_ARRAY_TRANSFER=1

[env:uno_r4_minima_spi24]
extends = env:uno_r4_minima
build_flags =
	-DUSE_SD_CRC=1
	-DUSE_SPI_ARRAY_TRANSFER=0
	-DSD_SPI_CLOCK_MHZ=24
lib_deps =
	fastled/FastLED@3.10.9
	Arduino_CAN
	greiman/SdFat@2.3.1
